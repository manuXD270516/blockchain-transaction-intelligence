[mcp_servers.graphify]
command = 'D:\projects\repos-ia-exp\blockchain-transaction-intelligence\.tools\graphify\Scripts\python.exe'
args = ['-m', 'graphify.serve', 'D:\projects\repos-ia-exp\blockchain-transaction-intelligence\graphify-out\graph.json']
enabled = true
enabled_tools = ['query_graph', 'get_node', 'get_neighbors', 'shortest_path', 'graph_stats']
